name: build

# The solver built and its suites run on every push to main, every pull request and on demand: the core library, the
# window and the tests, every warning an error, on the organisation's self-hosted Windows runner (the repository is
# private). The .NET 10 SDK is installed into the runner's tool cache for the job; Sudoku.exe is kept as the run's
# artifact. The one job is named CI, the check a ruleset requires.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: CI
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: .NET 10 SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build sudoku.slnx -c Release
      - name: Test
        run: dotnet test sudoku.slnx -c Release --no-build
      - name: Upload Sudoku.exe
        uses: actions/upload-artifact@v6
        with:
          name: sudoku-windows
          path: src/app/bin/Release/net10.0-windows/
          if-no-files-found: error
          retention-days: 30
