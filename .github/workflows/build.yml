name: build

# Reckless Sudoku built, tested and packaged on every push to main, every pull request and on demand: Windows with MSVC
# (every suite, the window's launch among them; RecklessSudoku.exe and the installer, unsigned, kept as the run's
# artifacts), Linux with gcc (every suite, the window's launch on Xvfb's display; the Debian package and the tarball,
# kept), macOS universal (every suite, both slices and the floor of 13.3 held; the installer package, unsigned, kept),
# each package held to its stage as release.yml holds a release's; the program's line coverage held to 95 % (gcc on
# Linux); every suite again under AddressSanitizer and UndefinedBehaviorSanitizer, and under ThreadSanitizer; and the C++
# held to clang-format 22.1.8. The repository is public, so every job runs on a GitHub-hosted runner, its image
# pinned by version (ubuntu-24.04, windows-2025, macos-15) and fresh each job, which costs a public repository
# nothing; .github/actions/cpp installs what an image lacks. The organisation's self-hosted runners are not used:
# its runner group does not serve public repositories, and opening it to them would let a fork's pull request run
# on Jonny's machines. The window is built on the
# toolkit, whose files are a git subtree in this repository (external/reckless-toolkit), so a checkout has
# them and no job fetches anything of its own. Every checkout is whole
# (fetch-depth 0): the version every binary reports is MAJOR.MINOR.BUILD from the nearest vMAJOR.MINOR tag
# (cmake/sudoku_version.cmake), which a shallow clone cuts off. The last job, CI, is the one check a ruleset requires:
# green only when every other job is.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fresh:
        description: Build from nothing, the kept build trees removed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A newer push to a pull request supersedes its run; every commit on main keeps a result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No suite or launch reaches the network for an update check.
env:
  RECKLESS_UPDATE_CHECK: "off"

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
      - name: Tidy the workspace
        run: |
          if ('${{ github.event.inputs.fresh }}' -eq 'true') { 'fresh: removing the kept tree'; Remove-Item -Recurse -Force build/ci -ErrorAction SilentlyContinue }
          if (Test-Path build/ci/CMakeCache.txt) { 'build/ci kept from the last run' } else { 'build/ci: building from nothing' }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build/ci-dist, build/ci-out
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      - name: Configure
        run: >
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          "-DFETCHCONTENT_BASE_DIR=${{ steps.cpp.outputs.deps }}" "-DPython3_EXECUTABLE=${{ steps.cpp.outputs.python }}"
      - name: Build
        run: cmake --build build/ci -j ${{ steps.cpp.outputs.jobs }}
      # Every suite: the solver's (every puzzle solved and each step held to the solution), the window's, the render
      # tool's pictures, the window's launch, which the runner's service draws on a window station that shows nothing,
      # and the third-party notices held to the pins.
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure -j $env:NUMBER_OF_PROCESSORS
      # The installer, unsigned, as release.yml makes it: the stage, the installer kept as an artifact, and a test build
      # of it installed for the runner's account under a folder of its own, every file checked at its place, the
      # program launched from there, upgraded and uninstalled with the sibling products' folders left as they were.
      - name: Package (the stage and the installer, installed and taken away)
        run: |
          $version = (Select-String -Path build/ci/generated/version.h -Pattern 'kVersion = "(.*)"').Matches[0].Groups[1].Value
          "version $version"
          & "${{ steps.cpp.outputs.python }}" -I packaging/stage.py build/ci build/ci-dist windows
          if ($LASTEXITCODE -ne 0) { throw "the stage failed" }
          pwsh -NoProfile -File packaging/windows/make_installer.ps1 -DistDir build/ci-dist -Version $version -OutDir build/ci-out -Fetch
          if ($LASTEXITCODE -ne 0) { throw "the installer was not made" }
          pwsh -NoProfile -File packaging/windows/test_installer.ps1 -DistDir build/ci-dist -Version $version
          if ($LASTEXITCODE -ne 0) { throw "the installer's test failed" }
      - name: Upload the executable
        uses: actions/upload-artifact@v6
        with:
          name: reckless-sudoku-windows
          path: build/ci/src/app/RecklessSudoku.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload the installer
        uses: actions/upload-artifact@v6
        with:
          name: reckless-sudoku-windows-installer
          path: build/ci-out/*.exe
          if-no-files-found: error
          retention-days: 30

  # The program's Linux build as it ships: Release with gcc, every suite, the window's launch on a display of Xvfb's,
  # then the Debian package and the tarball made as release.yml makes them, each held to the stage and kept as artifacts.
  linux:
    name: Linux (gcc)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
      - name: Tidy the workspace
        run: |
          if [ "${{ github.event.inputs.fresh }}" = "true" ]; then echo "fresh: removing the kept tree"; rm -rf build/ci-linux; fi
          rm -rf build/ci-linux-dist build/ci-linux-out
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      - name: Configure
        run: >
          cmake -S . -B build/ci-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          "-DFETCHCONTENT_BASE_DIR=${{ steps.cpp.outputs.deps }}"
      - name: Build
        run: cmake --build build/ci-linux -j ${{ steps.cpp.outputs.jobs }}
      - name: Test
        run: ctest --test-dir build/ci-linux --output-on-failure -j "$(nproc)" -LE '^window$'
      # The window's launch (label window, app_smoke) on a display of its own.
      - name: Test the window on a display (xvfb-run)
        run: xvfb-run -a -s "-screen 0 1600x1200x24" ctest --test-dir build/ci-linux --output-on-failure -L '^window$'
      - name: Package (the stage, the Debian package and the tarball)
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*kVersion = "\(.*\)".*/\1/p' build/ci-linux/generated/version.h)
          echo "version $version"
          python3 -I packaging/stage.py build/ci-linux build/ci-linux-dist linux
          packaging/linux/make_tarball.sh build/ci-linux-dist "$version" "build/ci-linux-out/reckless-sudoku-$version-linux-x64.tar.xz"
          packaging/linux/make_deb.sh build/ci-linux-dist "$version" "build/ci-linux-out/reckless-sudoku-$version-linux-amd64.deb"
          packaging/linux/test_deb.sh build/ci-linux-dist "$version" "build/ci-linux-out/reckless-sudoku-$version-linux-amd64.deb"
      - name: Upload the packages
        uses: actions/upload-artifact@v6
        with:
          name: reckless-sudoku-linux
          path: build/ci-linux-out/*
          if-no-files-found: error
          retention-days: 30

  # One binary for Apple silicon and Intel (the release-universal preset), for macOS 13.3 on, on the Apple silicon
  # runner: every binary held to both slices and the floor, every suite natively (the window's launch on the runner's
  # window server), then the installer package made unsigned as release.yml makes it, held to its stage and kept.
  macos:
    name: macOS (universal)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
      - name: Tidy the workspace
        run: |
          if [ "${{ github.event.inputs.fresh }}" = "true" ]; then echo "fresh: removing the kept tree"; rm -rf build/release-universal; fi
          rm -rf build/ci-macos-dist build/ci-macos-out
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      - name: Configure
        run: >
          cmake --preset release-universal -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          "-DFETCHCONTENT_BASE_DIR=${{ steps.cpp.outputs.deps }}"
      - name: Build
        run: cmake --build --preset release-universal -j ${{ steps.cpp.outputs.jobs }}
      - name: Every binary holds arm64 and x86_64, for macOS 13.3 on
        run: |
          set -euo pipefail
          tree=build/release-universal
          for binary in "$tree/src/app/RecklessSudoku.app/Contents/MacOS/RecklessSudoku" "$tree/src/app/sudoku_render" \
                        "$tree/tests/sudoku_solver_test" "$tree/tests/app/sudoku_app_test"; do
            lipo -info "$binary"
            for arch in arm64 x86_64; do lipo "$binary" -verify_arch "$arch"; done
            minos=$(vtool -show-build "$binary" | awk '/minos/ {print $2}' | sort -u)
            [ "$minos" = 13.3 ] || { echo "::error::$binary is for macOS $minos, not 13.3"; exit 1; }
          done
      # The bundle as the system checks it: signed whole (ad hoc, by the build), its plist naming the icon it carries -
      # assets/icon/icon.icns byte for byte - and asking for nothing the program does not use (no microphone).
      - name: The app's bundle
        run: |
          set -euo pipefail
          app=build/release-universal/src/app/RecklessSudoku.app
          codesign --verify --deep --strict "$app"
          icon=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$app/Contents/Info.plist")
          cmp "$app/Contents/Resources/$icon" assets/icon/icon.icns ||
            { echo "::error::the bundle's $icon, which its plist names, is not assets/icon/icon.icns"; exit 1; }
          if /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$app/Contents/Info.plist" 2> /dev/null; then
            echo "::error::the plist asks for the microphone"; exit 1
          fi
      - name: Test
        run: ctest --preset release-universal -j "$(sysctl -n hw.ncpu)"
      # The x86_64 slice run too, under Rosetta 2: the solver's suite.
      - name: Test the Intel slice (Rosetta 2)
        run: arch -x86_64 build/release-universal/tests/sudoku_solver_test --gtest_brief=1
      - name: Package (the stage and the installer)
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*kVersion = "\(.*\)".*/\1/p' build/release-universal/generated/version.h)
          echo "version $version"
          python3 -I packaging/stage.py build/release-universal build/ci-macos-dist macos
          packaging/macos/make_installer.sh build/ci-macos-dist "$version" "build/ci-macos-out/reckless-sudoku-$version-macos.pkg"
          packaging/macos/test_installer.sh build/ci-macos-dist "$version" "build/ci-macos-out/reckless-sudoku-$version-macos.pkg"
      - name: Upload the installer
        uses: actions/upload-artifact@v6
        with:
          name: reckless-sudoku-macos
          path: build/ci-macos-out/*.pkg
          if-no-files-found: error
          retention-days: 30

  # Every suite under AddressSanitizer and UndefinedBehaviorSanitizer (the sanitize preset's options), the window's
  # launch on Xvfb's display, with a leak a failure and nothing suppressed. Kept tree build/ci-sanitize. So that a
  # kernel's wider mmap randomisation never meets the sanitizers' fixed shadow memory, the suites run with the address
  # space's randomisation off (setarch -R), which their children inherit.
  sanitizers:
    name: Linux sanitizers (address, undefined)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      - name: Configure
        run: >
          cmake -S . -B build/ci-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSUDOKU_SANITIZE=ON
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON "-DFETCHCONTENT_BASE_DIR=${{ steps.cpp.outputs.deps }}"
      - name: Build
        run: cmake --build build/ci-sanitize -j ${{ steps.cpp.outputs.jobs }}
      - name: Test
        run: setarch "$(uname -m)" -R ctest --test-dir build/ci-sanitize --output-on-failure -j "$(nproc)" -LE '^window$'
      - name: Test the window on a display (xvfb-run)
        run: >
          setarch "$(uname -m)" -R xvfb-run -a -s "-screen 0 1600x1200x24"
          ctest --test-dir build/ci-sanitize --output-on-failure -L '^window$'

  # Every suite under ThreadSanitizer (the tsan preset's options), its own build since it cannot share a process with
  # AddressSanitizer: the program's code and the toolkit's, the window's shell among it, with nothing suppressed. The
  # prebuilt Skia is not instrumented, and draws on the calling thread alone. Kept tree build/ci-tsan; randomisation off
  # as above.
  tsan:
    name: Linux sanitizer (thread)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      - name: Configure
        run: >
          cmake -S . -B build/ci-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSUDOKU_TSAN=ON
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON "-DFETCHCONTENT_BASE_DIR=${{ steps.cpp.outputs.deps }}"
      - name: Build
        run: cmake --build build/ci-tsan -j ${{ steps.cpp.outputs.jobs }}
      - name: Test
        run: setarch "$(uname -m)" -R ctest --test-dir build/ci-tsan --output-on-failure -j "$(nproc)" -LE '^window$'
      - name: Test the window on a display (xvfb-run)
        run: >
          setarch "$(uname -m)" -R xvfb-run -a -s "-screen 0 1600x1200x24"
          ctest --test-dir build/ci-tsan --output-on-failure -L '^window$'

  # Line coverage of the program's own code (src/solver and src/app, but the app's entry point), gcc's, read by gcovr
  # 8.3: a debug build instrumented, every suite and the render tool's runs on Linux, red under 95 % of the lines of
  # src/, each directory's own figure in the report. The window's launch is left to the jobs that build the program as
  # it ships; on a desk, tools/coverage-windows.ps1 measures the same with clang-cl. Kept tree build/ci-coverage; its
  # counters cleared before every run. gcovr takes a count past 2^32 for a corrupt one; the rated puzzles call the
  # grid's accessors billions of times, so the threshold is 2^40.
  coverage:
    name: Coverage (Linux, gcc)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      # gcovr in a venv of the tool cache.
      - name: gcovr 8.3
        id: gcovr
        run: |
          gcovr="$RUNNER_TOOL_CACHE/gcovr-8.3"
          if [ ! -x "$gcovr/bin/gcovr" ]; then python3 -m venv "$gcovr" && "$gcovr/bin/pip" install --quiet gcovr==8.3; fi
          echo "gcovr=$gcovr/bin/gcovr" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: >
          cmake -S . -B build/ci-coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSUDOKU_COVERAGE=ON
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON "-DFETCHCONTENT_BASE_DIR=${{ steps.cpp.outputs.deps }}"
      - name: Build
        run: cmake --build build/ci-coverage -j ${{ steps.cpp.outputs.jobs }}
      - name: Test
        run: |
          find build/ci-coverage -name '*.gcda' -delete
          ctest --test-dir build/ci-coverage --output-on-failure -j ${{ steps.cpp.outputs.jobs }} -LE '^window$'
      - name: Coverage, 95 % of lines or red
        run: >
          mkdir -p build/ci-coverage/coverage &&
          "${{ steps.gcovr.outputs.gcovr }}" --root . --filter 'src/' --exclude 'src/app/main[.]cpp' build/ci-coverage
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
          --gcov-suspicious-hits-threshold 1099511627776
          --print-summary --txt build/ci-coverage/coverage.txt --html-details build/ci-coverage/coverage/index.html
          --json-summary build/ci-coverage/coverage-summary.json
          --fail-under-line 95
      # The report, and each directory's lines (src/solver, src/app) from the summary.
      - name: The report
        if: always()
        run: |
          cat build/ci-coverage/coverage.txt || true
          python3 - build/ci-coverage/coverage-summary.json <<'EOF' || true
          import json, sys
          totals = {}
          for entry in json.load(open(sys.argv[1]))["files"]:
              directory = "/".join(entry["filename"].split("/")[:2])
              covered, lines = totals.get(directory, (0, 0))
              totals[directory] = (covered + entry["line_covered"], lines + entry["line_total"])
          for directory, (covered, lines) in sorted(totals.items()):
              print(f"{directory}: {100 * covered / lines:.2f} % of lines ({covered} of {lines})")
          EOF
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reckless-sudoku-coverage
          path: build/ci-coverage/coverage
          if-no-files-found: ignore
          retention-days: 30

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - name: clang-format 22.1.8
        run: |
          venv="$RUNNER_TOOL_CACHE/clang-format-22.1.8"
          if [ ! -x "$venv/bin/clang-format" ]; then
            python3 -m venv "$venv"
            "$venv/bin/pip" install --quiet 'clang-format==22.1.8'
          fi
          "$venv/bin/clang-format" --version
          files=$(git ls-files -- 'src/*.h' 'src/*.cpp' 'tests/*.h' 'tests/*.cpp')
          echo "$(echo "$files" | grep -c .) files"
          "$venv/bin/clang-format" --dry-run -Werror $files

  # The one check a ruleset requires: green when every job above passed, red when any failed, was cancelled or did not
  # run.
  ci:
    name: CI
    needs: [windows, linux, macos, sanitizers, tsan, coverage, format]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: >-
            windows=${{ needs.windows.result }} linux=${{ needs.linux.result }} macos=${{ needs.macos.result }}
            sanitizers=${{ needs.sanitizers.result }} tsan=${{ needs.tsan.result }}
            coverage=${{ needs.coverage.result }} format=${{ needs.format.result }}
        run: |
          failed=""
          for result in $RESULTS; do
            echo "$result"
            [ "${result#*=}" = success ] || failed="$failed ${result%%=*}"
          done
          [ -z "$failed" ] || { echo "::error::not green:$failed"; exit 1; }
          echo "Green."
